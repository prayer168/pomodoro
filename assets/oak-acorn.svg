<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 320" role="img" aria-labelledby="title desc"><title>專注橡樹與橡實動畫</title><desc>橡樹從小苗長大，最後在樹冠中結出橡實。</desc><style>
                  .sky{fill:#dff3ec}.sun{fill:#ffd666}.ground{fill:#6ca24d}
                  .trunk{fill:#9b6a3d}.trunk-line{stroke:#75502f;stroke-width:5;stroke-linecap:round;fill:none}
                  .leaf-dark{fill:#365f2b}.leaf{fill:#527f3c}.leaf-hi{fill:#66934e}
                  .acorn-body{fill:#9b6a35}.acorn-cap{fill:#6e4729}.acorn-stem{stroke:#6e4729;stroke-width:4;stroke-linecap:round;fill:none}
                  .oak{transform-origin:215px 248px;animation:grow 4s ease-in-out infinite alternate}
                  .acorn{opacity:0;transform-box:fill-box;transform-origin:center;animation:fruit 4s ease-in-out infinite alternate}
                  @keyframes grow{0%{transform:scale(.28)}70%,100%{transform:scale(1)}}
                  @keyframes fruit{0%,72%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
                </style><rect class="sky" width="430" height="320" rx="18"/><circle class="sun" cx="342" cy="62" r="26"/><ellipse class="ground" cx="215" cy="300" rx="255" ry="74"/><g class="oak"><path class="trunk" d="M199 248 C199 210 203 176 212 140 C221 176 231 211 231 248Z"/><path class="trunk-line" d="M214 238 C214 202 217 174 224 150"/><ellipse class="leaf-dark" cx="178" cy="124" rx="78" ry="66"/><ellipse class="leaf" cx="230" cy="102" rx="86" ry="78"/><ellipse class="leaf-hi" cx="276" cy="136" rx="70" ry="58"/><ellipse class="leaf" cx="216" cy="158" rx="98" ry="70"/><g class="acorn" transform="translate(174 132) scale(0.7)" style="animation-delay:0.05s"><path class="acorn-body" d="M0 8 C-10 10 -15 20 -12 31 C-9 43 0 50 10 42 C19 34 19 17 10 10 C7 8 4 7 0 8Z"/><path class="acorn-cap" d="M-14 9 C-8 -2 7 -4 16 5 C11 12 -5 14 -14 9Z"/><path class="acorn-stem" d="M4 -2 C8 -8 12 -10 17 -12"/></g><g class="acorn" transform="translate(243 118) scale(0.8)" style="animation-delay:0.15s"><path class="acorn-body" d="M0 8 C-10 10 -15 20 -12 31 C-9 43 0 50 10 42 C19 34 19 17 10 10 C7 8 4 7 0 8Z"/><path class="acorn-cap" d="M-14 9 C-8 -2 7 -4 16 5 C11 12 -5 14 -14 9Z"/><path class="acorn-stem" d="M4 -2 C8 -8 12 -10 17 -12"/></g><g class="acorn" transform="translate(222 170) scale(0.72)" style="animation-delay:0.25s"><path class="acorn-body" d="M0 8 C-10 10 -15 20 -12 31 C-9 43 0 50 10 42 C19 34 19 17 10 10 C7 8 4 7 0 8Z"/><path class="acorn-cap" d="M-14 9 C-8 -2 7 -4 16 5 C11 12 -5 14 -14 9Z"/><path class="acorn-stem" d="M4 -2 C8 -8 12 -10 17 -12"/></g></g></svg>
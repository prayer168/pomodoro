<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作番茄鐘</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-labelledby="app-title">
    <section class="timer-panel" aria-label="番茄鐘">
      <header class="topbar">
        <div>
          <p class="eyebrow">Pomodoro</p>
          <h1 id="app-title">工作番茄鐘</h1>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="切換深色模式" title="切換深色模式">
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <div class="mode-tabs" role="tablist" aria-label="計時模式">
        <button class="mode-tab active" type="button" data-mode="focus">專注</button>
        <button class="mode-tab" type="button" data-mode="short">短休息</button>
        <button class="mode-tab" type="button" data-mode="long">長休息</button>
      </div>

      <div class="timer-face" aria-live="polite">
        <div class="forest-scene" id="forestScene" aria-hidden="true">
          <div class="sky-dot dot-one"></div>
          <div class="sky-dot dot-two"></div>
          <div class="plant oak-plant" id="focusPlant">
            <span class="leaf leaf-left"></span>
            <span class="leaf leaf-right"></span>
            <span class="crown crown-back"></span>
            <span class="crown crown-front"></span>
            <span class="acorn acorn-one"></span>
            <span class="acorn acorn-two"></span>
            <span class="acorn acorn-three"></span>
            <span class="trunk"></span>
          </div>
          <div class="ground">
            <span class="sprout sprout-one"></span>
            <span class="sprout sprout-two"></span>
            <span class="sprout sprout-three"></span>
          </div>
        </div>
        <div class="time-readout" id="timeReadout">25:00</div>
        <div class="progress-bar" aria-hidden="true">
          <span id="progressValue"></span>
        </div>
        <p class="phase-label" id="phaseLabel">專注時間</p>
      </div>

      <div class="actions" aria-label="主要操作">
        <button class="primary-action" id="startPause" type="button">種下專注橡樹</button>
        <button class="secondary-action" id="resetTimer" type="button">重設</button>
        <button class="secondary-action" id="skipTimer" type="button">跳過</button>
      </div>
    </section>

    <aside class="side-panel" aria-label="工作設定">
      <section class="task-block">
        <label for="currentTask">目前專注任務</label>
        <textarea id="currentTask" rows="4" placeholder="寫下這一輪只要完成的一件事"></textarea>
      </section>

      <section class="stats-row" aria-label="今日進度">
        <div>
          <span class="stat-number" id="todayCount">0</span>
          <span class="stat-label">今日森林</span>
        </div>
        <button class="text-button" id="clearToday" type="button">清除今日</button>
      </section>

      <section class="forest-patch" aria-label="今日種下的橡樹">
        <div id="forestPatch"></div>
      </section>

      <section class="settings">
        <h2>時間設定</h2>
        <div class="setting-grid">
          <label>
            <span>專注</span>
            <input id="focusMinutes" type="number" min="1" max="120" value="25">
          </label>
          <label>
            <span>短休息</span>
            <input id="shortMinutes" type="number" min="1" max="60" value="5">
          </label>
          <label>
            <span>長休息</span>
            <input id="longMinutes" type="number" min="1" max="90" value="15">
          </label>
        </div>
        <label class="check-row">
          <input id="soundToggle" type="checkbox" checked>
          <span>結束時播放提示音</span>
        </label>
        <label class="check-row">
          <input id="notifyToggle" type="checkbox">
          <span>結束時顯示瀏覽器通知</span>
        </label>
      </section>

      <section class="cycle-note">
        <h2>節奏</h2>
        <p id="cycleText">每完成一段專注，就在今日森林種下一棵結出橡實的橡樹。完成 4 棵後，下一段休息會切到長休息。</p>
      </section>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
